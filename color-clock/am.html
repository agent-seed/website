    <style>
        

html body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
}
.background {
  width: 100%;
  height: 100%;
  position: absolute;
  vertical-align: middle;
}

#hex {
  color: white;
  font-family: 'Lato', Helvetiva, Arial, sans-serif;
  text-align: center;
  font-size: 6.5em;
  display: block;
  min-width: 200px;
  font-weight: 100;
}

.absolute-center {
  /*width: 50%;*/
    margin: auto;
    position: absolute;
    top: 50%; left: 50%;
    -webkit-transform: translate(-50%,-50%);
      -ms-transform: translate(-50%,-50%);
          transform: translate(-50%,-50%);
}
    </style>
 <script>
    

function refreshData()
{
    var x = 1;
    var d = new Date();
    var h24 = d.getHours();
    var m = d.getMinutes();
    var s = d.getSeconds();
    var ampm = (h24 >= 12) ? 'PM' : 'AM';
    var h12 = h24 % 12;
    if (h12 === 0) { h12 = 12; }
    var displayH = (h12 <= 9) ? '0' + h12 : h12;
    var displayM = (m <= 9) ? '0' + m : m;
    var displayS = (s <= 9) ? '0' + s : s;
    // var color = '#' + displayH + displayM + displayS;
    var color = '#' + h24 + m + s;
    var text = displayH + ':' + displayM + ':' + displayS;
  
    $("div.background").css("background-color", color );
    $("p#hex").text(color + " " + ampm);

    setTimeout(refreshData, x * 1000);
}
refreshData();

 </script>
